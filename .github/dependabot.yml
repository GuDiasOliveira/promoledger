# Weekly dependency update PRs. CI must pass before merging any of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the version bundled in the editor's Prettier extension (see CLAUDE.md).
      - dependency-name: prettier

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
