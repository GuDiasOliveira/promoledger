services:
  postgres:
    image: postgres:16-alpine
    container_name: promoledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: promoledger
      POSTGRES_PASSWORD: promoledger
      POSTGRES_DB: promoledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promoledger -d promoledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
